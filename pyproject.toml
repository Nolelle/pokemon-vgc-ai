[project]
name = "pokemon-vgc-ai"
version = "0.1.0"
description = "Pokemon Showdown VGC (Champions mod, Reg M-C doubles) bot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "poke-env>=0.15",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
train = [
    "torch>=2.13.0",
    "wandb>=0.19.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    ".uv-cache",
    "data/champions",
    "runs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: starts a local Showdown server and runs real battles (excluded by default)",
]
addopts = "-m 'not integration'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vgc"]
